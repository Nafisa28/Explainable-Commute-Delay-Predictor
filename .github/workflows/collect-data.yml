# ============================================================================
# Data Collection Workflow - Explainable Commute Delay Predictor
# ============================================================================
# Runs collect_traffic.py and collect_weather.py on a 30-minute cron schedule
# so data accumulates continuously without a local machine running.
#
# REQUIRED GITHUB SECRETS (Settings > Secrets and variables > Actions):
#   - SUPABASE_URL       : Your Supabase project URL (e.g. https://xxxx.supabase.co)
#   - SUPABASE_KEY       : Your Supabase service-role key
#   - WEATHER_API_KEY    : OpenWeatherMap API key
#   - TOMTOM_API_KEY     : TomTom Routing API key (traffic-aware routing)
# ============================================================================

name: Collect Data

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run traffic data collection
        run: python backend/scripts/collect_traffic.py

      - name: Run weather data collection
        run: python backend/scripts/collect_weather.py
